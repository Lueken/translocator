[package]
name = "translocator"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "translocator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The webview inspector in RELEASE builds. Off by default, and it must stay
# that way in anything handed to another person: the login form holds the
# account password in component state while it is being typed, and a shipped
# launcher that opens an inspector on F12 puts that one keypress away from
# anyone at the machine - screen sharing included, which for a game launcher is
# close to the normal case.
#
# Debug builds (`npm run tauri dev`) get devtools from Tauri regardless of this
# feature, so day-to-day development is unaffected. For a field-debug release:
#   cargo build --release --features devtools
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util"] }
zip = "2"
json5 = "0.4"
semver = "1"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }

